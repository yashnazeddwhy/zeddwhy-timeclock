<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ZeddWhy Clock-in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305122b'/%3E%3Cpath d='M18 20h28l-20 24h20' fill='none' stroke='%231fb6e8' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#05122b;--navy2:#0b2250;--blue:#1f6fe5;--blue-d:#1658bd;--cyan:#1fb6e8;--bg:#eef3fa;--card:#fff;--ink:#0e1b33;--muted:#62708a;--line:#e1e8f3;--ok:#13805b;--okbg:#e2f6ee;--warn:#9a5a06;--warnbg:#fff1dc;--bad:#c4264a;--badbg:#fde6ec;--info:#1f6fe5;--infobg:#e6efff;--mute:#51607a;--mutebg:#edf1f7;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 4px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mutebg)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}.b-mute{background:var(--mutebg);color:var(--mute)}
.logo{display:block;-webkit-mask-image:radial-gradient(ellipse 62% 66% at 50% 50%,#000 52%,transparent 98%);mask-image:radial-gradient(ellipse 62% 66% at 50% 50%,#000 52%,transparent 98%)}
.muted{color:var(--muted)}

/* login */
#loginView{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#0d2c66 0%,var(--navy) 60%);color:#fff;display:none}
.login{max-width:420px;margin:0 auto;padding:7vh 20px 40px;text-align:center}
.login .logo{width:100%;max-width:340px;margin:0 auto 6px}
.login h1{font-size:28px;font-weight:800;margin-top:8px}
.login p{color:#a8bde3;margin:6px 0 22px}
.field{margin-bottom:12px;text-align:left}
.field input{height:50px;border:0;border-radius:12px;color:#0e1b33}
.login .btn{width:100%;height:50px;font-size:16px;margin-top:6px}
.show{display:flex;gap:8px;align-items:center;color:#a8bde3;font-size:14px;margin:4px 0 0;text-align:left}
.show input{width:auto;height:auto}
.err{color:#ff9db1;margin-top:12px;min-height:20px}

/* portal */
#portal{display:none;min-height:100vh}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 24px}
.bar .logo{height:58px;width:auto}
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.who b{font-weight:600}
.link{background:none;border:0;color:#9fc2ff;cursor:pointer;padding:4px;text-decoration:underline}
.bar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.grid{max-width:1180px;margin:0 auto;padding:22px 20px 48px;display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
.clockcard{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;border-radius:20px;padding:26px 22px;text-align:center}
.clockcard .date{color:#b9c9e8}
.bigtime{font:800 56px Manrope,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.status{color:#cfe0ff;margin-top:8px;min-height:24px}
.clockbtn{width:100%;height:72px;border:0;border-radius:16px;font:800 22px Manrope,sans-serif;margin-top:18px;cursor:pointer;color:#fff;background:var(--blue)}
.clockbtn:hover{filter:brightness(1.08)}
.clockbtn.out{background:#d93a52}
.clockbtn:disabled{background:#2f4167;color:#8fa2c6;cursor:default;filter:none}
.shift{margin-top:14px;font-size:13px;color:#8fa2c6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat strong{font:800 20px Manrope,sans-serif}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:19px;font-weight:800}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mnav{display:flex;align-items:center;gap:8px}
.mnav span{min-width:140px;text-align:center;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f7f9fd}
tr:last-child td{border-bottom:0}
tr.today td{background:#f1f6ff}
tr.off td{color:var(--muted)}
.hrs{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
th.hrs{text-align:right}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.alert{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:12px;display:none}

/* sheet + toast */
#sheet{position:fixed;inset:0;background:rgba(5,18,43,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#sheet.open{display:flex}
#sheetBox{background:var(--bg);width:100%;max-width:420px;border-radius:18px;padding:20px}
#sheetBox h3{font-size:20px;font-weight:800;margin-bottom:4px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30;max-width:90%;text-align:center}
#toast.bad{background:var(--bad)}

@media (max-width:900px){
  .grid{grid-template-columns:1fr;padding:16px 14px 40px}
  .bar{padding:6px 14px}.bar .logo{height:48px}
  .bigtime{font-size:46px}
}
</style>
</head>

const WORK_DAYS = [1, 2, 3, 4, 5]; // Monday to Friday

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hm = mins => { mins = Math.round(mins); return Math.floor(mins / 60) + 'h ' + pad(mins % 60) + 'm'; };
const toMin = t => { const [h, m] = t.split(':'); return +h * 60 + +m; };
const minsBetween = (a, b) => (a && b) ? Math.max(0, toMin(b) - toMin(a)) : 0;
const parts = d => d.split('-').map(Number);
const addDays = (d, n) => { const [y, m, dd] = parts(d); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); };
const mondayOf = d => { const [y, m, dd] = parts(d); const w = new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); return addDays(d, -((w + 6) % 7)); };
const lastDay = m => { const [y, mo] = parts(m); return new Date(Date.UTC(y, mo, 0)).toISOString().slice(0, 10); };
const dow = d => { const [y, m, dd] = parts(d); return new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); };
const isOff = d => !WORK_DAYS.includes(dow(d));
const fmtDate = (d, o) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', o);
const muParts = () => {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Indian/Mauritius', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const g = k => p.find(x => x.type === k).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, time: `${g('hour')}:${g('minute')}:${g('second')}` };
};
const lab = s => String(s || '').replace('_', ' ').replace(/^./, c => c.toUpperCase());
const CLS = { present: 'ok', late: 'warn', half_day: 'warn', absent: 'bad', dayoff: 'mute', none: 'mute', leave: 'info', sickness: 'bad' };
const badge = (t, k) => `<span class="badge b-${CLS[k] || 'mute'}">${esc(t)}</span>`;
let toastTimer;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', bad ? 5000 : 2500); }
function openSheet(html) { $('#sheetBox').innerHTML = html; $('#sheet').classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); }

/* ---------- state ---------- */
let ME = null, ATT = [], VM = muParts().date.slice(0, 7), lastDate = muParts().date, timer = null, busy = false;

async function loadAtt() {
  const mu = muParts(), mon = mondayOf(mu.date);
  const from = [VM + '-01', mon].sort()[0], to = [lastDay(VM), addDays(mon, 6)].sort().pop();
  const r = await db.from('attendance').select('*').eq('agent_id', ME.id).gte('work_date', from).lte('work_date', to).order('work_date', { ascending: false });
  if (r.error) { toast(r.error.message, true); return; }
  ATT = r.data || [];
}
const todayRow = () => ATT.find(r => r.work_date === muParts().date);

function statusText() {
  const mu = muParts(), t = todayRow();
  if (!t || !t.time_in) return 'You have not clocked in yet';
  if (!t.time_out) return `Clocked in at ${t.time_in.slice(0, 5)} · ${hm(Math.max(0, toMin(mu.time) - toMin(t.time_in)))} so far`;
  return `In ${t.time_in.slice(0, 5)} · Out ${t.time_out.slice(0, 5)} · ${hm(minsBetween(t.time_in, t.time_out))} worked today`;
}

/* ---------- rendering ---------- */
function render() {
  const mu = muParts(), t = todayRow(), mon = mondayOf(mu.date);
  const btn = !t || !t.time_in ? `<button class="clockbtn" onclick="doClock('in')">Clock in</button>`
    : !t.time_out ? `<button class="clockbtn out" onclick="doClock('out')">Clock out</button>` : `<button class="clockbtn" disabled>Done for today</button>`;
  const wkMins = ATT.filter(r => r.work_date >= mon && r.work_date <= addDays(mon, 6)).reduce((s, r) => s + minsBetween(r.time_in, r.time_out), 0);
  const inMonth = ATT.filter(r => r.work_date.startsWith(VM));
  const moMins = inMonth.reduce((s, r) => s + minsBetween(r.time_in, r.time_out), 0);
  const worked = inMonth.filter(r => r.time_in).length, late = inMonth.filter(r => r.status === 'late').length;
  document.title = t && t.time_in && !t.time_out ? 'Clocked in · ZeddWhy' : 'ZeddWhy Clock-in';
  $('#whoName').textContent = ME.full_name || '';
  $('#leftCol').innerHTML = `<div class="clockcard">
      <div class="date">${esc(fmtDate(mu.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}</div>
      <div class="bigtime" id="bigTime">${mu.time}</div>
      <div class="date" style="font-size:13px">Mauritius time</div>
      <div class="status" id="ckStatus">${esc(statusText())}</div>${btn}
      <div class="alert" id="ckErr" role="alert"></div>
      <div class="shift">Your shift: Monday to Friday, 10:30 – 19:30</div></div>
    <div class="stats">
      <div class="stat"><small>This week</small><strong>${hm(wkMins)}</strong></div>
      <div class="stat"><small>${esc(fmtDate(VM + '-01', { month: 'long' }))} total</small><strong>${hm(moMins)}</strong></div>
      <div class="stat"><small>Days worked</small><strong>${worked}</strong></div>
      <div class="stat"><small>Late arrivals</small><strong>${late}</strong></div></div>`;

  const isCur = VM === mu.date.slice(0, 7), lastShown = isCur ? mu.date : lastDay(VM), rows = [];
  for (let d = lastShown; d >= VM + '-01'; d = addDays(d, -1)) {
    const r = ATT.find(x => x.work_date === d), off = isOff(d);
    const k = r ? r.status : off ? 'dayoff' : d === mu.date ? 'none' : 'none';
    const label = r ? lab(r.status) : off ? 'Day off' : d === mu.date ? 'Not clocked in' : 'No record';
    rows.push(`<tr class="${d === mu.date ? 'today' : ''} ${off && !r ? 'off' : ''}"><td>${esc(fmtDate(d, { weekday: 'short', day: 'numeric', month: 'short' }))}</td><td>${r && r.time_in ? esc(r.time_in.slice(0, 5)) : '–'}</td><td>${r && r.time_out ? esc(r.time_out.slice(0, 5)) : '–'}</td><td class="hrs">${r && r.time_in && r.time_out ? hm(minsBetween(r.time_in, r.time_out)) : '–'}</td><td>${badge(label, k)}</td></tr>`);
  }
  $('#rightCol').innerHTML = `<div class="panel">
    <div class="head"><h2>My timesheet</h2><div class="mnav"><button class="btn ghost small" onclick="shiftMonth(-1)">‹ Previous</button><span>${esc(fmtDate(VM + '-01', { month: 'long', year: 'numeric' }))}</span><button class="btn ghost small" onclick="shiftMonth(1)" ${isCur ? 'disabled' : ''}>Next ›</button></div></div>
    <div class="tablewrap"><table><thead><tr><th>Date</th><th>Clock in</th><th>Clock out</th><th class="hrs">Hours</th><th>Status</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <p class="note">If a time looks wrong, tell your manager. Only management can correct clock records.</p></div>`;
}
async function shiftMonth(n) {
  const [y, m] = parts(VM + '-01'); VM = new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7);
  await loadAtt(); render();
}
async function doClock(kind) {
  if (busy) return; busy = true;
  const b = document.querySelector('.clockbtn'); if (b) { b.disabled = true; b.textContent = kind === 'in' ? 'Clocking in…' : 'Clocking out…'; }
  const r = await db.rpc(kind === 'in' ? 'clock_in' : 'clock_out');
  busy = false;
  await loadAtt(); render();
  if (r.error) { const e = $('#ckErr'); if (e) { e.textContent = r.error.message; e.style.display = 'block'; } return; }
  toast(kind === 'in' ? 'You are clocked in. Have a good shift!' : 'You are clocked out. See you next time!');
}
function startTimers() {
  clearInterval(timer);
  timer = setInterval(async () => {
    const mu = muParts(), t = $('#bigTime'); if (t) t.textContent = mu.time;
    const s = $('#ckStatus'); if (s) s.textContent = statusText();
    if (mu.date !== lastDate) { lastDate = mu.date; VM = mu.date.slice(0, 7); await loadAtt(); render(); }
    else if (mu.time.slice(6) === '00' && +mu.time.slice(3, 5) % 5 === 0) { await loadAtt(); render(); }
  }, 1000);
}
document.addEventListener('visibilitychange', async () => { if (!document.hidden && ME) { await loadAtt(); render(); } });

/* ---------- password ---------- */
function openPwd() {
  openSheet(`<h3>Change password</h3><form onsubmit="savePwd(event)">
    <label>New password (at least 8 characters)</label><input name="p1" type="password" minlength="8" autocomplete="new-password" required>
    <label>Repeat new password</label><input name="p2" type="password" minlength="8" autocomplete="new-password" required>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn">Save</button></div></form>`);
}
async function savePwd(e) {
  e.preventDefault(); const f = new FormData(e.target);
  if (f.get('p1') !== f.get('p2')) return toast('The two passwords do not match', true);
  const r = await db.auth.updateUser({ password: f.get('p1') });
  if (r.error) return toast(r.error.message, true);
  closeSheet(); toast('Password changed');
}

/* ---------- sign in ---------- */
function showLogin(msg) {
  clearInterval(timer); ME = null; $('#portal').style.display = 'none'; const l = $('#loginView'); l.style.display = 'block';
  l.innerHTML = `<div class="login"><img class="logo" src="${LOGO_FULL}" alt="ZeddWhy Interactive Ltd"><h1>Agent clock-in</h1><p>Sign in to clock in and out and see your timesheet</p>
  <form onsubmit="signIn(event)">
    <div class="field"><input name="email" type="email" placeholder="Email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
    <div class="field"><input name="password" type="password" placeholder="Password" autocomplete="current-password" required></div>
    <label class="show"><input type="checkbox" onchange="this.form.password.type=this.checked?'text':'password'"> Show password</label>
    <button class="btn" id="loginBtn">Sign in</button><div class="err" id="loginErr">${esc(msg || '')}</div></form></div>`;
}
async function signIn(e) {
  e.preventDefault(); const f = new FormData(e.target), b = $('#loginBtn'); b.disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: f.get('email').trim().toLowerCase(), password: f.get('password') });
  b.disabled = false;
  if (error) { $('#loginErr').textContent = error.message; return; }
  boot();
}
async function signOut() { clearInterval(timer); await db.auth.signOut(); showLogin(); }
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return showLogin();
  const me = await db.from('agents').select('*').eq('user_id', session.user.id);
  if (me.error || !me.data || !me.data.length) { await db.auth.signOut(); return showLogin('This login is not linked to an agent profile. Please ask your manager.'); }
  ME = me.data[0]; VM = muParts().date.slice(0, 7); lastDate = muParts().date;
  $('#loginView').style.display = 'none'; $('#portal').style.display = 'block';
  await loadAtt(); render(); startTimers();
}
boot();
</script>
